name: NOUN BOT Production Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noun-bot-production-smoke
  cancel-in-progress: true

env:
  BASE_URL: https://noun-student-bot-dashboard.vercel.app
  PUBLIC_ALIAS_URL: https://noun.vercel.app

jobs:
  smoke:
    name: Verify production surface
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Wait for production surface
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$BASE_URL/" || true)"
            echo "Production root HTTP status: $status (attempt $attempt)"
            if [[ "$status" == "200" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Production surface did not become ready."
          exit 1

      - name: Verify public pages
        shell: bash
        run: |
          set -euo pipefail
          for path in / /auth/ /student/ /dashboard/; do
            echo "Checking $BASE_URL$path"
            for attempt in {1..5}; do
              if curl --fail-with-body --silent --show-error --max-time 20 "$BASE_URL$path" >/dev/null; then
                break
              fi
              if [[ "$attempt" == "5" ]]; then
                echo "Failed: $BASE_URL$path"
                exit 1
              fi
              sleep 5
            done
          done

      - name: Verify product markers
        shell: bash
        run: |
          set -euo pipefail
          home="$(curl --fail-with-body --silent --show-error --max-time 20 "$BASE_URL/")"
          auth="$(curl --fail-with-body --silent --show-error --max-time 20 "$BASE_URL/auth/")"
          student="$(curl --fail-with-body --silent --show-error --max-time 20 "$BASE_URL/student/")"
          dashboard="$(curl --fail-with-body --silent --show-error --max-time 20 "$BASE_URL/dashboard/")"
          grep -q "Study at NOUN" <<<"$home"
          grep -q "Create your student space" <<<"$auth"
          grep -q "Academic pulse" <<<"$student"
          grep -q "Ask ABBA" <<<"$student"
          grep -q "data-motion-tilt" <<<"$student"
          grep -q "startViewTransition" <<<"$student"
          grep -q "Protected command center" <<<"$dashboard"

      - name: Check public alias reconciliation
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          alias_status="$(curl --silent --show-error --max-time 20 --output /tmp/noun-alias.html --write-out '%{http_code}' "$PUBLIC_ALIAS_URL/" || true)"
          echo "Public alias HTTP status: $alias_status"
          if [[ "$alias_status" == "200" ]] && grep -q 'Study at NOUN' /tmp/noun-alias.html; then
            echo 'Public alias is serving the current NOUN BOT surface.'
          else
            echo 'Public alias is reachable but is not serving the current NOUN BOT release. See recovery issue for reconciliation.'
            exit 1
          fi

      - name: Verify canonical CIBN catalog
        shell: bash
        run: |
          set -euo pipefail
          catalog="$(curl --fail-with-body --silent --show-error --max-time 20 "$BASE_URL/api/cibn-catalog")"
          grep -q '"catalog_version":"2026-10-official-timetable"' <<<"$catalog"
          grep -q '"MF403"' <<<"$catalog"
          grep -q '"2026-10-07"' <<<"$catalog"
          grep -q '"MF404"' <<<"$catalog"
