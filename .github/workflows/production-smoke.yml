name: NOUN BOT Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noun-bot-production-smoke
  cancel-in-progress: true

env:
  BASE_URL: https://noun-student-bot-dashboard.vercel.app

jobs:
  smoke:
    name: Verify production surface
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Wait for production surface
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$BASE_URL/" || true)"
            echo "Production root HTTP status: $status (attempt $attempt)"
            if [[ "$status" == "200" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Production surface did not become ready."
          exit 1

      - name: Verify public pages
        shell: bash
        run: |
          set -euo pipefail
          for path in / /dashboard/ /student/; do
            echo "Checking $BASE_URL$path"
            for attempt in {1..5}; do
              if curl --fail-with-body --silent --show-error --max-time 20 "$BASE_URL$path" >/dev/null; then
                break
              fi
              if [[ "$attempt" == "5" ]]; then
                echo "Failed: $BASE_URL$path"
                exit 1
              fi
              sleep 5
            done
          done

      - name: Verify product markers
        shell: bash
        run: |
          set -euo pipefail
          dashboard="$(curl --fail-with-body --silent --show-error --max-time 20 "$BASE_URL/dashboard/")"
          student="$(curl --fail-with-body --silent --show-error --max-time 20 "$BASE_URL/student/")"
          grep -q "Your AI academic companion" <<<"$dashboard"
          grep -q "Create my student space" <<<"$dashboard"
          grep -q "Academic pulse" <<<"$student"
          grep -q "Ask ABBA" <<<"$student"
          grep -q "We do not display your details publicly" <<<"$dashboard"
