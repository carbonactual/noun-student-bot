name: NOUN Intelligence Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Run intelligence monitor
        env:
          MONITOR_SECRET: ${{ secrets.INTELLIGENCE_CRON_SECRET }}
        run: |
          test -n "$MONITOR_SECRET" || { echo 'Missing INTELLIGENCE_CRON_SECRET secret'; exit 1; }
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST "https://noun-student-bot-dashboard.vercel.app/api/service-intelligence" \
            -H 'content-type: application/json' \
            -H "x-intelligence-secret: $MONITOR_SECRET" \
            --data '{"trigger":"github-actions","mode":"scheduled","action":"expire"}'
