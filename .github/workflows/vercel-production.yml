name: NOUN BOT Vercel Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noun-bot-vercel-production
  cancel-in-progress: true

env:
  VERCEL_PROJECT_ID: prj_rwrKir1bcYxvroyYOB9GiXu7mAD8
  VERCEL_ORG_ID: team_vw6sNkb9okBmWBIJiP0pBy9J
  PRODUCTION_URL: https://noun-student-bot-dashboard.vercel.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"

      - name: Bind repository to existing Vercel project
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Verify NOUN production
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            root_code="$(curl --silent --show-error --max-time 20 --output /tmp/root.html --write-out '%{http_code}' "$PRODUCTION_URL/" || true)"
            catalog_code="$(curl --silent --show-error --max-time 20 --output /tmp/catalog.json --write-out '%{http_code}' "$PRODUCTION_URL/api/cibn-catalog" || true)"
            echo "Root=$root_code Catalog=$catalog_code (attempt $attempt)"
            if [[ "$root_code" == "200" && "$catalog_code" == "200" ]] && grep -q '"catalog_version":"2026-10-official-timetable"' /tmp/catalog.json; then
              exit 0
            fi
            sleep 5
          done
          cat /tmp/catalog.json || true
          exit 1
