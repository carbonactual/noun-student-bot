<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOUN Student Bot — Ops</title><style>body{margin:0;background:#09131b;color:#e8eef2;font:14px system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:32px 20px 70px}h1{margin:0 0 6px;font-size:30px}.sub{color:#91a5b2;margin-bottom:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card,section{background:#101f29;border:1px solid #233845;border-radius:10px}.card{padding:20px}.n{font-size:34px;font-weight:700}.l{color:#91a5b2;margin-top:6px}section{margin-top:22px;padding:20px}h2{font-size:17px;margin:0 0 14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #233845}th{color:#91a5b2;font-size:11px;text-transform:uppercase}code{color:#b8d7e7}.pill{padding:3px 8px;border-radius:20px;background:#173d2b;color:#8fe0a8}</style></head><body><main class="wrap"><h1>NOUN Student Bot</h1><div class="sub">Privacy-safe operations dashboard · WhatsApp onboarding · study support · campaigns</div><div id="stats" class="grid"></div><section><h2>Students by level</h2><div id="levels"></div></section><section><h2>Top registered courses</h2><div id="courses"></div></section><section><h2>Upcoming deadlines</h2><table><thead><tr><th>Level</th><th>Course</th><th>Title</th><th>Due</th></tr></thead><tbody id="deadlines"></tbody></table></section><section><h2>Campaigns</h2><table><thead><tr><th>Name</th><th>Status</th><th>Created</th></tr></thead><tbody id="campaigns"></tbody></table></section><p class="sub" id="loaded"></p></main><script>async function load(){const r=await fetch('/api/dashboard');if(!r.ok)throw Error('dashboard unavailable');const d=await r.json();const s=d.stats;document.querySelector('#stats').innerHTML=[['Students',s.students],['Active',s.active_students],['Upcoming deadlines',s.upcoming_deadlines],['Exam checklists',s.checklists],['Open help',s.open_help]].map(x=>`<div class="card"><div class="n">${x[1]}</div><div class="l">${x[0]}</div></div>`).join('');document.querySelector('#levels').innerHTML=Object.entries(d.by_level).sort().map(([k,v])=>`<span class="pill">${k}L: ${v}</span> `).join('')||'No data';document.querySelector('#courses').innerHTML=Object.entries(d.by_course).sort((a,b)=>b[1]-a[1]).slice(0,30).map(([k,v])=>`<span class="pill">${k}: ${v}</span> `).join('')||'No data';document.querySelector('#deadlines').innerHTML=d.deadlines.map(x=>`<tr><td>${x.level}L</td><td><code>${x.course}</code></td><td>${x.title}</td><td>${x.due_date}</td></tr>`).join('')||'<tr><td colspan="4">No deadlines</td></tr>';document.querySelector('#campaigns').innerHTML=d.campaigns.map(x=>`<tr><td>${x.name}</td><td>${x.status}</td><td>${new Date(x.created_at).toLocaleDateString()}</td></tr>`).join('')||'<tr><td colspan="3">No campaigns</td></tr>';document.querySelector('#loaded').textContent='Updated '+new Date(d.generated_at).toLocaleString('en-NG',{timeZone:'Africa/Lagos'});}load().catch(e=>document.querySelector('.wrap').insertAdjacentHTML('beforeend',`<section>${e.message}</section>`));setInterval(load,60000);</script></body></html>
